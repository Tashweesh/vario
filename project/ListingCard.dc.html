<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div dir="rtl" onClick="{{ l.open }}" style="cursor:pointer;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:#1d1e22;display:flex;flex-direction:column;gap:10px">
  <div style="position:relative;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:#f6f6f4">
    <img src="{{ l.img }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s" style-hover="transform:scale(1.04)">
    <div style="position:absolute;top:12px;inset-inline-start:12px;display:flex;gap:6px">
      <span style="height:26px;padding:0 10px;border-radius:999px;background:rgba(255,255,255,.95);font-size:12px;font-weight:600;display:inline-flex;align-items:center">{{ l.dealLabel }}</span>
      <sc-if value="{{ l.isInstall }}" hint-placeholder-val="{{ false }}"><span style="height:26px;padding:0 10px;border-radius:999px;background:#c8102e;color:#fff;font-size:12px;font-weight:600;display:inline-flex;align-items:center">تقسيط</span></sc-if>
    </div>
    <button onClick="{{ l.toggleSave }}" aria-label="حفظ" style="position:absolute;top:10px;inset-inline-end:10px;width:34px;height:34px;border-radius:999px;border:0;background:rgba(255,255,255,.95);display:grid;place-items:center;cursor:pointer">
      <sc-if value="{{ l.isSaved }}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="#c8102e" stroke="#c8102e" stroke-width="1.7" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"></path></svg></sc-if>
      <sc-if value="{{ l.notSaved }}" hint-placeholder-val="{{ true }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1d1e22" stroke-width="1.7" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l8.8 8.8 8.8-8.8a5.5 5.5 0 0 0 0-7.8z"></path></svg></sc-if>
    </button>
  </div>
  <div>
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px"><div style="font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none" dir="ltr">{{ l.priceText }} <span style="font-size:12.5px;color:#767a83;font-weight:500">{{ l.per }}</span></div><span style="font-size:12px;color:#767a83;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">{{ l.id }}</span></div>
    <div style="font-weight:600;font-size:15px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ l.title }}</div>
    <div style="font-size:13px;color:#767a83;margin-top:2px">{{ l.areaName }} · {{ l.facts }}</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:330},&quot;l&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
