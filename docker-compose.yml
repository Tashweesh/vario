services:
  vario:
    container_name: vario
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-}
        VITE_MAP_TILE_ATTR: ${VITE_MAP_TILE_ATTR:-}
    image: vario:latest
    restart: unless-stopped
    # Serves on 80 inside the container. Nginx Proxy Manager reaches it over
    # npm_default as http://vario:80; the host port is random and only a convenience.
    expose:
      - "80"
    ports:
      - "80"
    networks:
      - npm_default

networks:
  npm_default:
    external: true
